# .github/workflows/ci.yml

name: Python CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # --- CHANGE 1: USE THE PGVECTOR IMAGE ---
        # This image comes with the vector extension pre-installed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # Make sure alembic and pytest are in this file

    # --- CHANGE 2: ADD A MIGRATION STEP ---
    - name: Run database migrations
      env:
        # The DATABASE_URL must be available for the migration command.
        DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
      run: |
        # This command tells Alembic to apply all migrations.
        alembic upgrade head

    - name: Run tests
      env:
        DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ALGORITHM: ${{ secrets.ALGORITHM }}
        ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
      run: |
        pytest